<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core" xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces" xmlns:pe="primefaces.extensions">

<!-- DASHBOARD ADD NEW WIDGET DECORATOR: uses for displaying the widget in Dashboard configuration pop up.
    DEFINED 2 SECTIONS: widget configuration and widget preview.
    - WIDGET CONFIGURATION: shows widget filters by defined widgetFilterContent tag.
    - WIDGET PREVIEW: shows widget content by define widgetPreviewContent tag.

    *** REQUIRED PARAMS:
    * widget: widget model.
    * onCompletePreviewAction: AJAX method which will be call when the preview button is clicked.
-->

<h:outputScript library="js" name="sidebar-widget-configuration.js" />

<!-- Table configuration -->
<h:panelGroup id="widget-preview" styleClass="table-configuration u-hidden-sm-down" layout="block">
  <div class="ui-g">
    <h:panelGroup id="widget-title-group" layout="block"
      styleClass="ui-g-8 u-padding-0 ui-fluid widget-header-group">
      <div class="ui-g-8">
        <p:outputLabel for="widget-title"
          value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/widgetTitle')}" />
      </div>
      <div class="ui-inputgroup ui-g-8">
        <p:inputText id="widget-title"
          styleClass="widget-configuration__input-text"
          value="#{widget.name}" />
        <!-- Add language button -->
        <p:commandButton styleClass="app-setting-button"
          ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/adminSettings/addLanguages')}"
          icon="ti ti-language" id="add-language-button"
          actionListener="#{managedBean.updateWidgetNameByLocale()}"
          process="widget-title"
          partialSubmit="true"
          update=":#{cc.clientId}:title-language-config:multiple-languages-dialog"
          oncomplete="PF('multiple-languages-dialog').show();" />
        </div>
    </h:panelGroup>  
    
    <div class="ui-g-4 flex align-self-end justify-content-end">
      <p:commandButton id="widget-configuration-button" 
        styleClass="mr-2 ui-button-widget" type="button" label="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/taskList/configuration')}"
        icon="ti ti-settings-cog" value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/taskList/configuration')}"  
        />
      <p:commandButton id="manage-column"
        icon="ti ti-cube" 
        styleClass="mr-2 ui-button-widget"
        ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/taskList/manageColumns')}"
        value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/taskList/manageColumns')}"
        update="#{p:resolveFirstComponentWithId('column-management-dialog', view).clientId}" 
        oncomplete="PF('column-management-dialog').show()" 
        process="@this" 
        global="false" >
        <p:resetInput target="#{p:resolveFirstComponentWithId('column-management-dialog', view).clientId}" />
      </p:commandButton>
      <p:commandButton id="show-filter" styleClass="mr-2 ui-button-widget" icon="ti ti-filter" 
        ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/components/taskView/filter')}"
        value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/components/taskView/filter')}"
        type="button" onclick="PF('widget-configuration-filter-dialog').show();"/>
    </div>

    <p:overlayPanel id="widget-configuration-panel" for="widget-configuration-button" 
      styleClass="widget-configuration-overlaypanel" widgetVar="widgetConfigurationPanel"
      appendTo="@(body)" my="right top" at="right bottom">
      <h4 class="widget-configuration-section-header">#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/displaySettings')}</h4>
      <h:panelGroup id="quick-search-group" layout="block"
        rendered="#{managedBean.canEnableQuickSearch()}"
        styleClass="widget-configuration-group-item ui-fluid flex">
        <div class="label-item">
          <p:outputLabel for="quick-search" styleClass="u-mar-right-5"
            value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/QuickSearch')}" />
          <h:outputText id="quick-search-info" styleClass="ti ti-info-circle" />
          <p:tooltip for="quick-search-info" value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/QuickSearchInfo')}" />
        </div>
        <div class="ui-inputgroup">
          <p:selectBooleanCheckbox id="quick-search"
            value="#{widget.enableQuickSearch}">
            <p:ajax process="quick-search-group" update="quick-search-group"
            partialSubmit="true" />
          </p:selectBooleanCheckbox>
        </div>
      </h:panelGroup>
      
      <h:panelGroup id="widget-info-icon-group" layout="block"
        rendered="#{managedBean.displayWidgetInfoOption()}"
        styleClass="widget-configuration-group-item ui-fluid flex">
        <div class="label-item">
          <p:outputLabel for="widget-info" styleClass="u-mar-right-5"
            value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/widgetInfoIcon')}"/>
        </div>
        <div class="ui-inputgroup">
          <p:selectBooleanCheckbox id="widget-info"
            value="#{widget.showWidgetInfo}">
            <p:ajax process="widget-info-icon-group" update="widget-info-icon-group"
            partialSubmit="true" />
          </p:selectBooleanCheckbox>
        </div>
      </h:panelGroup>
      
      <h:panelGroup id="fullscreen-mode-group" layout="block"
        rendered="#{managedBean.displayFullscreenModeOption()}"
        styleClass="widget-configuration-group-item ui-fluid flex">
        <div class="label-item">
          <p:outputLabel for="fullscreen-mode" styleClass="u-mar-right-5"
            value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/fullscreenMode')}"/>
        </div>
        <div class="ui-inputgroup">
          <p:selectBooleanCheckbox id="fullscreen-mode"
            value="#{widget.showFullscreenMode}">
            <p:ajax process="fullscreen-mode-group" update="fullscreen-mode-group"
            partialSubmit="true" />
          </p:selectBooleanCheckbox>
        </div>
      </h:panelGroup>
      
      <h:panelGroup id="pinned-toggle-group" layout="block"
        rendered="#{managedBean.displayPinnedItemToggleOption(widget)}"
        styleClass="widget-configuration-group-item ui-fluid flex">
        <div class="label-item">
          <p:outputLabel for="pinned-toggle-option" styleClass="u-mar-right-5"
            value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/ShowPinnedToggle')}"/>
        </div>
        <div class="ui-inputgroup">
          <p:selectBooleanCheckbox id="pinned-toggle-option"
            value="#{widget.showPinnedToggle}">
            <p:ajax process="pinned-toggle-group" update="pinned-toggle-group"
            partialSubmit="true" />
          </p:selectBooleanCheckbox>
        </div>
      </h:panelGroup>

      <h:panelGroup id="bulk-delegate-toggle-group" layout="block"
        rendered="#{managedBean.displayBulkDelegateToggleOption(widget)}"
        styleClass="widget-configuration-group-item ui-fluid flex">
        <div class="label-item">
          <p:outputLabel for="bulk-delegate-toggle-option" styleClass="u-mar-right-5"
            value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/dashboard/component/TaskWidgetConfiguration/ShowBulkDelegateToggle')}"/>
        </div>
        <div class="ui-inputgroup">
          <p:selectBooleanCheckbox id="bulk-delegate-toggle-option"
            value="#{widget.showBulkDelegateToggle}">
            <p:ajax process="bulk-delegate-toggle-group" update="bulk-delegate-toggle-group"
            partialSubmit="true" />
          </p:selectBooleanCheckbox>
        </div>
      </h:panelGroup>
      
      <!-- Case Query Type Selector (Case Widget only) -->
      <h:panelGroup rendered="#{widget.type.name() == 'CASE'}">
        <h4 class="widget-configuration-section-header separator-top">#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/dataSettings')}</h4>
      </h:panelGroup>
      <h:panelGroup id="case-query-type-group"
        rendered="#{widget.type.name() == 'CASE'}"
        styleClass="widget-configuration-group-item ui-fluid flex">
        <div class="case-type-label-item">
          <p:outputLabel for="case-query-type" styleClass="u-mar-right-5"
            value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/CaseQueryType/label')}" />
          <h:outputText id="case-query-type-info" styleClass="ti ti-info-circle" />
          <p:tooltip for="case-query-type-info" 
            value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/CaseQueryType/info')}" />
        </div>
        <div>
          <p:selectOneMenu id="case-query-type" value="#{widget.caseQueryType}" styleClass="case-query-type-selector">
            <f:selectItems value="#{managedBean.allCaseQueryTypes}" var="caseQueryType"
              itemLabel="#{caseQueryType.getCmsName()}" itemValue="#{caseQueryType}" />
            <p:ajax process="case-query-type-group" update="case-query-type-group #{componentToUpdateOnPreview}" partialSubmit="true" />
          </p:selectOneMenu>
        </div>
      </h:panelGroup>
    </p:overlayPanel>
    <!-- Widget data -->
    <div class="ui-g-12">
      <ui:insert name="widgetPreviewContent" />
    </div>
  </div>
</h:panelGroup>

  <p:dialog id="widget-filter-content" widgetVar="widget-configuration-filter-dialog"
      styleClass="widget-configuration-filter-dialog"
      header="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/Filter/SetFilterHeader')}"
      modal="false" closable="true" closeOnEscape="true" responsive="true"
      draggable="false" resizable="false" dynamic="false" fitViewport="true">
      <p:remoteCommand id="updateComponentOnPreviewCmd" name="updateComponentOnPreviewCmd"
        process="@none" update="#{componentToUpdateOnPreview}" />

      <h:panelGroup layout="block" styleClass="filter-dialog__body flex flex-column flex-1 min-h-0">
        <ui:insert name="widgetFilterContent" />
      </h:panelGroup>

      <p:divider layout="horizontal" />

      <div class="flex align-items-center justify-content-end footer-buttons-container">
        <p:commandLink id="reset-filter" styleClass="flex align-items-center reset-button portal-link"
          process="predefined-filter"
          update="predefined-filter configuration-filter-messages-panel"
          actionListener="#{taskWidgetConfigurationFilterBean.resetFilter(widget)}"
          ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/resetFilters')}">
          <f:param name="skipValidator" value="true" />
          <i class="pr-1 ti ti-refresh"/>
          <span>#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/resetFilters')}</span>
        </p:commandLink>

        <p:commandButton id="preview-button" styleClass="preview-button"
          value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/Filter/ApplyFilters')}"
          ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/dashboard/Filter/ApplyFilters')}"
          actionListener="#{taskWidgetConfigurationFilterBean.updateWidgetFilterBeforeApply(widget)}"
          process="predefined-filter widget-title"
          update="predefined-filter configuration-filter-messages-panel"
          oncomplete="closeFilterPanelWithValidation(); if (args &amp;&amp; !args.validationFailed) { updateComponentOnPreviewCmd(); }" />
      </div>

      <ui:insert name="multiLanguageDialog" />
  </p:dialog>
 

</html>
