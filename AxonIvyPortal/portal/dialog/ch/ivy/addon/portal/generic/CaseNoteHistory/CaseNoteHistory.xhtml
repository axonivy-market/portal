<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="http://primefaces.org/ui"
  xmlns:pe="http://primefaces.org/ui/extensions"
  xmlns:pc="jakarta.faces.composite/components"  xmlns:c="jakarta.tags.core" xmlns:jsf="jakarta.faces">
<h:body>
  <ui:composition template="/layouts/BasicTemplate.xhtml">
    <ui:param name="isNotRequiredLogin" value="false" />
    <ui:define name="title">#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/noteHistory/caseHistoryPageTitle')}</ui:define>
    <ui:define name="pageContent">
      <h:form id="form" onkeypress="if (event.keyCode == 13) { return false; }" styleClass="ui-g">
        <h:panelGroup layout="block" styleClass="portal-detail-toolbar">
          <h:panelGroup layout="block" styleClass="portal-detail-toolbar-start u-truncate-text">
            <p:commandLink id="back-to-case-details" process="@this"
              actionListener="#{caseTaskNoteHistoryBean.navigateToCaseDetails(data.ivyCase)}"
              ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/back')}"
              styleClass="portal-detail-toolbar-back">
              <i class="ti ti-chevron-left" aria-hidden="true" />
              <h:outputText value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/back')}" />
            </p:commandLink>
          </h:panelGroup>
        </h:panelGroup>

        <h:panelGroup layout="block" styleClass="portal-detail-body portal-detail-page-content">
          <h:panelGroup layout="block" styleClass="card case-detail-card">
            <h:panelGroup layout="block" id="general-information" styleClass="case-detail-attr-strip">
              <div class="case-detail-attr">
                <h:outputText styleClass="portal-detail-column-title"
                  value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/name')}" />
                <div class="case-detail-attr-value u-truncate-text">
                  <h:outputText id="case-name" value="#{data.ivyCase.names().current()}" />
                </div>
              </div>

              <div class="case-detail-attr">
                <h:outputText styleClass="portal-detail-column-title"
                  value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/caseList/defaultColumns/ID')}" />
                <div class="case-detail-attr-value">
                  <h:outputText id="case-id" value="#{data.ivyCase.id}" />
                </div>
              </div>

              <h:panelGroup layout="block" styleClass="case-detail-attr" rendered="#{!visibilityBean.hideCaseCreator}">
                <h:outputText styleClass="portal-detail-column-title"
                  value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/caseList/defaultColumns/CREATOR')}" />
                <div class="case-detail-attr-value u-truncate-text">
                  <pc:securityMemberNameAndAvatar securityMember="#{data.ivyCase.creatorUser}"
                    displayName="#{securityMemberDisplayNameFormatBean.generateBriefDisplayNameForSecurityMember(data.ivyCase.creatorUser, data.ivyCase.creatorUser.name)}" />
                </div>
              </h:panelGroup>

              <div class="case-detail-attr">
                <h:outputText styleClass="portal-detail-column-title"
                  value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/caseList/defaultColumns/STATE')}" />
                <div class="case-detail-attr-value">
                  <h:panelGroup id="case-state-cell" styleClass="case-header-default-cell">
                    <ic:ch.ivy.addon.portalkit.component.cases.column.CaseState id="case-state"
                      case="#{data.ivyCase}" showIndicatorBesideText="true" responsiveStyleClass=""/>
                  </h:panelGroup>
                </div>
              </div>
            </h:panelGroup>
          </h:panelGroup>

          <h:panelGroup layout="block" styleClass="card case-detail-card">
            <h:panelGroup layout="block" styleClass="portal-detail-widget-header">
              <div class="portal-detail-widget-header-title u-truncate-text" role="heading" aria-level="2">
                #{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/noteHistory/caseHistoryPageTitle')}
              </div>
              <h:panelGroup layout="block" styleClass="portal-detail-widget-header-actions">
                  <p:commandButton
                    id="export-to-excel"
                    ajax="false"
                    styleClass="portal-icon-btn-round"
                    ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/noteHistory/exportButton')}"
                    title="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/noteHistory/exportButton')}"
                    icon="ti ti-file-type-xls">
                    <p:fileDownload value="#{caseTaskNoteHistoryBean.getStreamedContentOfCaseNoteHistory(data.filteredHistories, data.ivyCase, data.exportedFileName)}" />
                  </p:commandButton>
              </h:panelGroup>
            </h:panelGroup>
            <p:dataTable id="notes-table" widgetVar="notesTable" var="history" sortBy="#{caseTaskNoteHistoryBean.caseHistorySortByTimestamp}"
              value="#{data.histories}" filteredValue="#{data.filteredHistories}"
              emptyMessage="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/noRecordsFound')}"
              reflow="true" lazy="false">
              <p:column sortBy="#{caseTaskNoteHistoryBean.getCaseNoteContent(history)}"
                filterBy="#{caseTaskNoteHistoryBean.getCaseNoteContent(history)}" filterMatchMode="contains"
                styleClass="u-truncate-text history-note"
                headerText="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/noteHistory/columnContent')}">
                <h:outputText value="#{caseTaskNoteHistoryBean.getCaseNoteContent(history)}" styleClass="case-task-note-histories"/>
              </p:column>
              <p:column headerText="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/noteHistory/relatedCase')}"
                sortBy="#{history.displayCaseName}"
                filterBy="#{history.displayCaseName}" filterMatchMode="contains"
                styleClass="u-truncate-text history-related-case"
                rendered="#{data.showRelatedCaseInfo}"
                width="20%">
                <p:commandLink value="#{history.displayCaseName}" ariaLabel="#{history.displayCaseName}"
                  actionListener="#{caseDetailsBean.navigateToCaseDetails(history.caseUUID)}"/>
              </p:column>
              <p:column width="200px" sortBy="#{history.displayName}"
                filterBy="#{history.displayName}"
                filterMatchMode="contains" styleClass="note-history-fullname-column u-hidden-sm-down"
                headerText="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/author')}">
                <pc:securityMemberNameAndAvatar
                  displayName="#{history.displayName}" securityMember="#{history.involvedUser}"
                  displayNameStyleClass="case-task-note-histories" />
              </p:column>
              <p:column width="150px" sortBy="#{history.timestamp}" styleClass="u-hidden-sm-down"
                headerText="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/creationDate')}">
                <h:outputText value="#{history.timestamp}">
                  <f:convertDateTime locale="#{localeBean.locale}" pattern="#{dateTimePatternBean.dateTimestampPattern}"/>
                </h:outputText>
              </p:column>
            </p:dataTable>
          </h:panelGroup>
        </h:panelGroup>
      </h:form>

    </ui:define>
  </ui:composition>
</h:body>
</html>
