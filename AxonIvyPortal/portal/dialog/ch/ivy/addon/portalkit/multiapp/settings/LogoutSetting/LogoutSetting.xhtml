<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="jakarta.faces.composite"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
  xmlns:c="jakarta.tags.core">
<!-- htmlSanitizerBean: com.axonivy.portal.components.bean.HtmlSanitizerBean -->
<cc:interface componentType="IvyComponent">
  <cc:attribute name="task" />
  <cc:attribute name="isWorkingOnATask" type="java.lang.Boolean" />
</cc:interface>

<cc:implementation>
  <f:event listener="#{logic.init(cc.attrs.isWorkingOnATask)}"
    type="preRenderComponent" />

  <c:set var="task"
    value="#{not empty cc.attrs.task ? cc.attrs.task : ivy.task}" />

  <p:commandLink id="logout-menu-item"
    ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/logoutSetting/logout')}"
    value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/logoutSetting/logout')}"
    styleClass=""
    rendered="#{!userMenuBean.hiddenLogout}"
    actionListener="#{logic.logout(task)}" />

  <ui:decorate template="/layouts/decorator/portal-dialog-with-icon.xhtml">
    <ui:param name="id" value="logout-confirmation-dialog" />
    <ui:param name="widgetVar" value="logoutConfirmation" />
    <ui:param name="appendTo" value="@(body)" />
    <ui:param name="rendered" value="#{data.isWorkingOnATask eq true}" />
    <ui:param name="iconClass" value="ti ti-alert-triangle" />
    <ui:param name="iconStyleClass" value="portal-dialog-warning-icon" />
    <ui:param name="iconCircleRendered" value="true" />
    <ui:param name="iconCircleStyleClass" value="portal-dialog-icon-circle-warning" />
    <ui:param name="headerText" value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/taskWarning/leaveTaskTitle')}" />
    <ui:param name="maxWidth" value="570px" />
    <ui:param name="styleClass" value="warning-before-leaving-task" />

    <ui:define name="dialogContentSection">
      <h:outputText rendered="#{task.state != 'CREATED'}"
        styleClass="ui-confirm-dialog-message"
        value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/taskWarning/resetParkTaskBeforeLogout')}" />
      <h:outputText rendered="#{task.state == 'CREATED'}"
        styleClass="ui-confirm-dialog-message"
        value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/taskWarning/createdTaskLogout')}" />
    </ui:define>

    <ui:define name="dialogFooter">
      <h:form prependId="false">
        <div class="w-full flex gap-2">
          <p:commandButton actionListener="#{logic.logoutInDialog(task)}"
            ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/logoutSetting/logout')}"
            process="@this" value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/logoutSetting/logout')}"
            styleClass="mx-0 ui-leave-button #{task.state == 'CREATED' ? 'w-full' : 'flex-1'}"
            oncomplete="returnHomePage()" />
          <p:tooltip for="reserve-task-button" trackMouse="true" rendered="#{task.state != 'CREATED'}"
            value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/leaveAndReserve')}" />
          <p:commandButton id="reserve-task-button" actionListener="#{logic.reserveTask(task)}" process="@this"
            rendered="#{task.state != 'CREATED'}" value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/reserve')}"
            ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/reserve')}"
            styleClass="flex-1 mx-0 ui-reserve-task-button" oncomplete="returnHomePage()" />
        </div>
      </h:form>
    </ui:define>
  </ui:decorate>

  <script type="text/javascript">
	function returnHomePage() {
      showConfirmDialogBeforeUnload = false;
      window.open('#{htmlSanitizerBean.escapeForJS(userMenuBean.logoutPage)}', '_self');
	}
  </script>
</cc:implementation>
</html>
