<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="primefaces">
  <div id="action-cell-#{rowIndex}" class="task-header-action-cell">
    <div class="action-container">
      <p:commandButton id="task-action-component" actionListener="#{logic.openTask(task,dataModel)}"
        ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/start')}"
        value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/start')}" icon="ti ti-player-play"
        disabled="#{!taskActionBean.isNotDone(task) or !taskActionBean.canResume(task) or cc.attrs.inFrame}" rendered="#{task.state != 'RESUMED' and !cc.attrs.readOnly}" onclick="event.stopPropagation();"
        styleClass="start-task-action portal-pill-btn portal-pill-btn-accent portal-pill-btn-sm" oncomplete="resetPortalLeftMenuState()" />

      <p:commandButton id="resume-task-action-component" disabled="#{!taskActionBean.isNotDone(task) or !taskActionBean.canResume(task) or cc.attrs.inFrame}"
        ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/start')}"
        value="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/common/start')}" icon="ti ti-player-play" type="button"
        rendered="#{task.state == 'RESUMED' and !cc.attrs.readOnly}" styleClass="start-task-action portal-pill-btn portal-pill-btn-accent portal-pill-btn-sm">
        <f:setPropertyActionListener value="#{task.id}" target="#{taskWidgetBean.selectedTaskItemId}"/>
        <p:ajax event="click" listener="#{logic.validate(task, dataModel)}" onstart="event.stopPropagation();"
          oncomplete="if (args &amp;&amp; !args.validationFailed) {PF('reset-task-dialog').show();}" />
      </p:commandButton>

      <ic:ch.ivy.addon.portalkit.component.SideStep id="additional-options" actionLinkId="task-side-steps-menu"
        isDisabled="#{cc.attrs.readOnly or cc.attrs.inFrame}" inFrame="#{inFrame}"
        panelWidgetVar="task-side-steps-panel-#{rowIndex}" renderedAdditionalAction="#{taskActionBean.showAdditionalOptions(task)}"
        task="#{task}" componentToUpdate="#{p:resolveFirstComponentWithId('related-tasks', view).clientId}" currentPortalPage="#{currentPortalPage}" showDetailOption="#{true}" dataModel="#{dataModel}"
        buttonStyleClass="ui-sm-hidden" onDestroyComplete="#{onDestroyComplete}"
        onDelegateComplete="#{onDelegateComplete}" destroyTaskDialogComponent="#{destroyTaskDialogComponent}"
        onEscalationComplete="#{onEscalationComplete}" onCustomFieldsDialogComplete="#{onCustomFieldsDialogComplete}"
        onWorkflowEventComplete="#{onWorkflowEventComplete}" />
    </div>
  </div>
</ui:composition>
