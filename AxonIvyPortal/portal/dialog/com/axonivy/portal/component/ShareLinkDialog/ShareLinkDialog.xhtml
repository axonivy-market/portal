<html xmlns="http://www.w3.org/1999/xhtml"
  xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html"
  xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="jakarta.faces.composite"
  xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces"
  xmlns:pe="primefaces.extensions"
  xmlns:c="jakarta.tags.core"
  xmlns:pc="jakarta.faces.composite/components"
  xmlns:pt="jakarta.faces.passthrough"
  xmlns:jsf="jakarta.faces">
<!-- htmlSanitizerBean: com.axonivy.portal.components.bean.HtmlSanitizerBean -->
<!-- This component brings its own h:form, so it must not be placed inside another form. -->
<cc:interface componentType="IvyComponent">
  <cc:attribute name="shareDialogId" required="true" />
  <cc:attribute name="url" required="true" />
  <cc:attribute name="title" required="false" />
  <cc:attribute name="displayAs" default="dialog" />
  <cc:attribute name="focusCopyButtonOnShow" type="java.lang.Boolean" default="true" />
  <cc:attribute name="my" default="right top" />
  <cc:attribute name="at" default="right bottom" />
  <cc:attribute name="styleClass" default="" />
</cc:interface>

<cc:implementation>
  <c:if test="#{cc.attrs.displayAs eq 'panel'}">
    <p:overlayPanel id="#{cc.attrs.shareDialogId}" widgetVar="#{cc.attrs.shareDialogId}"
      appendTo="@(body)"
      my="#{cc.attrs.my}" at="#{cc.attrs.at}" styleClass="share-link-panel #{cc.attrs.styleClass}"
      onShow="PortalShareLink.onShow('#{cc.attrs.shareDialogId}', #{cc.attrs.focusCopyButtonOnShow})">
      <h:panelGroup layout="block" styleClass="share-link-panel-content">
        <div class="ui-fluid ui-inputgroup share-link-panel-input-group">
          <p:inputText id="url" value="#{cc.attrs.url}" readonly="true" disabled="true"
            pt:aria-label="#{ivy.cms.co('/Dialogs/com/axonivy/portal/component/ShareLinkDialog/Link')}" />
        </div>
        <h:form id="share-link-form">
          <p:commandButton id="share-link-copy-button" tabindex="1"
            ariaLabel="#{ivy.cms.co('/Dialogs/com/axonivy/portal/component/ShareLinkDialog/CopyLink')}"
            value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/component/ShareLinkDialog/CopyLink')}"
            icon="#{visibilityBean.generateButtonIcon('ti ti-copy')}"
            onclick="PortalShareLink.copy('#{cc.attrs.shareDialogId}', '#{htmlSanitizerBean.escapeForJS(cc.attrs.url)}')"
            actionListener="#{masterDataBean.showLinkCopiedMessage()}" process="@this" global="false"
            styleClass="w-full" />
        </h:form>
      </h:panelGroup>
    </p:overlayPanel>
  </c:if>

  <c:if test="#{cc.attrs.displayAs ne 'panel'}">
    <p:dialog id="#{cc.attrs.shareDialogId}"
      widgetVar="#{cc.attrs.shareDialogId}"
      styleClass="share-dialog"
      header="#{cc.attrs.title}" appendTo="@(body)" closeOnEscape="true"
      draggable="false" fitViewport="true" responsive="true" modal="true" closable="true"
      width="auto"
      onShow="PortalShareLink.onShow('#{cc.attrs.shareDialogId}', #{cc.attrs.focusCopyButtonOnShow})">
      <p:outputLabel styleClass="text-xl pl-2 pb-2 font-semibold" value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/component/ShareLinkDialog/Link')}" />
      <div class="ui-fluid ui-inputgroup pl-2 mt-3">
        <p:inputText id="url" value="#{cc.attrs.url}" readonly="true" />
      </div>
      <f:facet name="footer">
        <h:form id="share-link-form" styleClass="text-right p-1">
          <p:commandButton id="share-link-copy-button"
            ariaLabel="#{ivy.cms.co('/Dialogs/com/axonivy/portal/component/ShareLinkDialog/CopyLink')}"
            value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/component/ShareLinkDialog/CopyLink')}"
            icon="#{visibilityBean.generateButtonIcon('ti ti-copy')}"
            onclick="PortalShareLink.copy('#{cc.attrs.shareDialogId}', '#{htmlSanitizerBean.escapeForJS(cc.attrs.url)}')"
            actionListener="#{masterDataBean.showLinkCopiedMessage()}" process="@this" global="false"
            styleClass="w-full" />
        </h:form>
      </f:facet>
    </p:dialog>
  </c:if>

  <h:outputScript library="js" name="share-link.js" />
</cc:implementation>
</html>
