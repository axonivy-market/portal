<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces">

  <h:panelGroup id="chart-region" layout="block" styleClass="smart-region smart-region--chart">
    <h:panelGroup id="chart-frame" layout="block" styleClass="smart-region__canvas">
      <h:panelGroup id="chart-canvas" layout="block"
        styleClass="ui-chart js-statistic-chart statistic-chart-widget__canvas">
        <f:passThroughAttribute name="data-chart-id" value="#{cc.attrs.card.chartId}" />
      </h:panelGroup>

      <p:skeleton id="chart-skeleton" styleClass="smart-region__skeleton" width="100%" height="100%"
        rendered="#{cc.attrs.card.available}" />

      <h:panelGroup id="chart-missing" layout="block" styleClass="smart-card__missing"
        rendered="#{not cc.attrs.card.available}">
        This chart is no longer available.
      </h:panelGroup>
    </h:panelGroup>
  </h:panelGroup>

</ui:composition>
