<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="primefaces">

  <!-- Bar colours: either a fixed palette, or conditions that pick the colour from the value. -->
  <h:panelGroup id="condition-based-coloring-container" class="field col-12 mb-0" layout="block">
    <h:panelGroup rendered="#{managedBean.statistic.chartType.name() ne 'NUMBER' and not managedBean.statistic.providerBacked}">
      <p:outputLabel for="condition-based-coloring-enabled-toggle"
        value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ConditionBasedColoring/ConditionBasedColoringEnabled')}" />
      <h:outputText id="condition-based-coloring-info" styleClass="ti ti-info-circle ml-2" />
      <p:tooltip for="condition-based-coloring-info"
        value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ConditionBasedColoring/Information')}" />
      <div>
        <p:toggleSwitch id="condition-based-coloring-enabled-toggle"
          value="#{managedBean.statistic.conditionBasedColoringEnabled}"
          styleClass="col-1">
          <p:ajax update="chart-background-colors condition-based-coloring-scope"
            process="@this"
            listener="#{managedBean.onToggleConditionBasedColoring}" />
        </p:toggleSwitch>
      </div>
    </h:panelGroup>
  </h:panelGroup>

  <h:panelGroup id="condition-based-coloring-scope" class="field col-6" layout="block">
    <h:panelGroup rendered="#{managedBean.statistic.conditionBasedColoringEnabled and managedBean.statistic.chartType.name() ne 'NUMBER'}">
      <p:outputLabel for="@next" value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ConditionBasedColoring/Scope')}" />
      <h:outputText id="coloring-option-info" styleClass="ti ti-info-circle ml-2" />
      <p:tooltip for="coloring-option-info" value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ConditionBasedColoring/ConditionBasedColoringScopeInformation')}" />
      <div>
        <p:selectOneMenu id="coloring-option" styleClass="w-full"
          value="#{managedBean.statistic.conditionBasedColoringScope}">
          <f:selectItems value="#{managedBean.conditionBasedColoringScopes}" var="scope" itemValue="#{scope}" itemLabel="#{scope.getCmsName()}" />
          <p:ajax update="chart-background-colors condition-background-colors-container"
            process="@this"
            listener="#{managedBean.onSelectColoringScope}" />
        </p:selectOneMenu>
      </div>
    </h:panelGroup>
  </h:panelGroup>

  <h:panelGroup id="chart-background-colors">

    <h:panelGroup id="background-colors-container" layout="block" styleClass="col-12 p-0 grid m-0" rendered="#{!managedBean.statistic.conditionBasedColoringEnabled}">
      <h:panelGroup rendered="#{managedBean.statistic.chartType.name() ne 'NUMBER'}">
        <ui:repeat id="background-colors" value="#{managedBean.backgroundColors}" var="color"
          varStatus="status">
          <div class="col-6 xl:col-3">
            <div>
              <p:outputLabel for="@next"
                value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/Color', [status.index + 1])}" />
            </div>
            <div class="mt-2 mb-3">
              <p:colorPicker value="#{managedBean.backgroundColors[status.index]}"
                clearButton="true" closeButton="true" size="10" />
            </div>
          </div>
        </ui:repeat>
      </h:panelGroup>
    </h:panelGroup>

    <h:panelGroup id="condition-background-colors-container" styleClass="col-12 p-0 grid m-0" layout="block" rendered="#{managedBean.statistic.conditionBasedColoringEnabled}">
      <h:panelGroup id="user-threshold">
        <h:panelGroup class="flex align-items-center">
          <p:outputLabel for="@next" styleClass="mr-3 ml-2" value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ConditionBasedColoring/DefaultColor')}" />
          <p:colorPicker required="true" label="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ConditionBasedColoring/DefaultColor')}" value="#{managedBean.statistic.defaultBackgroundColor}" size="10" clearButton="true" closeButton="true" />
        </h:panelGroup>

        <ui:repeat id="condition-background-color-list" var="threshold" value="#{managedBean.statistic.thresholdStatisticCharts}"
          varStatus="status">
          <ic:com.axonivy.portal.page.component.ThresholdStatisticChart id="threshold-component"
            managedBean="#{managedBean}" threshold="#{threshold}" componentToUpdate="#{p:resolveFirstComponentWithId('user-threshold', view).clientId}"
            thresholdIndex="#{status.index}" readOnly="true" />
        </ui:repeat>

        <div class="col-12 MarTop10">
          <p:commandButton id="add-threshold" icon="#{visibilityBean.generateButtonIcon('ti ti-circle-plus')}" disabled="#{!managedBean.isCategoryDataAvailable and managedBean.statistic.conditionBasedColoringScope eq 'SPECIFIC'}"
            styleClass="u-mar-right-5 ui-button-flat" actionListener="#{managedBean.addNewThreshold()}" process="condition-background-colors-container"
            value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ConditionBasedColoring/AddCondition')}" immediate="true" partialSubmit="true" update="condition-background-colors-container">
            <f:param name="skipValidator" value="true" />
          </p:commandButton>
        </div>

        <h:panelGroup rendered="#{!managedBean.isCategoryDataAvailable and managedBean.statistic.conditionBasedColoringScope eq 'SPECIFIC'}">
          <div class="col-12">#{ivy.cms.co("/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ConditionBasedColoring/NoDataAvailable")}</div>
        </h:panelGroup>
      </h:panelGroup>
    </h:panelGroup>
  </h:panelGroup>

</ui:composition>
