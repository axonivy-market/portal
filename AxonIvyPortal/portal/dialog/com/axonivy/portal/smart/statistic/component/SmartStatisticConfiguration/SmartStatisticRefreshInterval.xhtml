<ui:composition xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces">

  <!-- How often a saved card re-reads its data. Task and case charts only. -->
  <h:panelGroup id="refresh-interval-section" layout="block">
    <h:panelGroup class="field flex col-12 h-5rem"
      rendered="#{not managedBean.statistic.providerBacked}">
      <div class="col-6 p-0">
        <p:outputLabel for="refresh-interval-enabled"
          value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/RefreshInterval')}" />
        <h:outputText id="refresh-interval-info" styleClass="ti ti-info-circle ml-2" />
        <p:tooltip for="refresh-interval-info"
          value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/RefreshIntervalInfo', [managedBean.getMinRefreshIntervalInSeconds()])}" />
        <div class="mt-2">
          <p:toggleSwitch id="refresh-interval-enabled"
            value="#{managedBean.refreshIntervalEnabled}" styleClass="col-1">
            <p:ajax update="refresh-interval-value-container" process="@this"
              listener="#{managedBean.onToggleRefreshInterval}" resetValues="true" />
          </p:toggleSwitch>
        </div>
      </div>

      <h:panelGroup id="refresh-interval-value-container" layout="block" styleClass="field col-6 pb-0 pt-0">
        <h:panelGroup rendered="#{managedBean.refreshIntervalEnabled}">
          <p:outputLabel for="@next"
            value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/RefreshIntervalInSeconds')}" />
          <div>
            <p:inputNumber id="refresh-interval-value"
              value="#{managedBean.statistic.refreshInterval}" decimalPlaces="0"
              maxValue="#{managedBean.getMaxRefreshIntervalInSeconds()}"
              onkeydown="return event.key !== '-'"
              inputStyleClass="w-full" />
          </div>
        </h:panelGroup>
      </h:panelGroup>
    </h:panelGroup>
  </h:panelGroup>

</ui:composition>
