<ui:composition xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces">

  <!-- Everything a chart works without: axis titles, refresh, the switches and colours. -->
  <p:panel id="advanced-settings" toggleable="true" toggleableHeader="true" collapsed="true"
    toggleSpeed="500" widgetVar="advanced-panel" styleClass="w-full smart-section"
    header="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/Advanced')}">
    <div>

      <ui:include src="SmartStatisticAxisTitles.xhtml">
        <ui:param name="managedBean" value="#{managedBean}" />
      </ui:include>

      <ui:include src="SmartStatisticRefreshInterval.xhtml">
        <ui:param name="managedBean" value="#{managedBean}" />
      </ui:include>

      <h:panelGroup id="hide-label-container" layout="block" styleClass="col-12 p-0">
        <h:panelGroup layout="block" styleClass="field col-12"
          rendered="#{managedBean.statistic.chartType.name() eq 'NUMBER'}">
          <p:outputLabel for="@next"
            value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/HideLabel')}" />
          <div>
            <p:toggleSwitch id="hide-label"
              value="#{managedBean.statistic.numberChartConfig.hideLabel}">
            </p:toggleSwitch>
          </div>
        </h:panelGroup>
      </h:panelGroup>

      <h:panelGroup id="chart-drill-down-container" class="field mb-0 col-12" layout="block">
        <h:panelGroup rendered="#{managedBean.statistic.statisticAggregation.field ne 'worker.name' and not managedBean.statistic.providerBacked}">
          <p:outputLabel for="@next" value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ChartDrillDownEnabled')}" />
          <h:outputText id="chart-drill-down-info" styleClass="ti ti-info-circle ml-2" />
          <p:tooltip for="chart-drill-down-info" value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ChartDrillDownInfo')}" escape="false" />
          <div>
            <p:toggleSwitch id="chart-drill-down-toggle" ariaLabel="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/ChartDrillDownEnabled')}"
              value="#{managedBean.statistic.chartDrillDownEnabled}"
              styleClass="col-1">
              <p:ajax update="chart-drill-down-toggle" process="@this" />
            </p:toggleSwitch>
          </div>
        </h:panelGroup>
      </h:panelGroup>

      <ui:include src="SmartStatisticColoring.xhtml">
        <ui:param name="managedBean" value="#{managedBean}" />
      </ui:include>

    </div>
  </p:panel>

</ui:composition>
