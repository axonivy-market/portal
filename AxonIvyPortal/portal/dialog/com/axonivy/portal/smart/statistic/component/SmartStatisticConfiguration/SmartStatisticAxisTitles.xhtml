<ui:composition xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces">

  <!-- Axis labels. Bar and line charts only. -->
  <h:panelGroup styleClass="flex">

    <h:panelGroup id="x-axis-title-container" layout="block" styleClass="col-6 p-0">
      <h:panelGroup layout="block" styleClass="field col-12"
        rendered="#{managedBean.statistic.chartType.name() eq 'BAR' or managedBean.statistic.chartType.name() eq 'LINE'}">
        <p:outputLabel
          value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/XAxisTitle')}"
          for="@next" />
        <div class="ui-inputgroup">
          <p:inputText id="x-title" value="#{managedBean.xTitle}" maxlength="200"
            styleClass="w-full" />
          <p:commandButton id="x-title-add-language-button" icon="ti ti-language"
            actionListener="#{managedBean.updateXTitleByLocale()}" process="x-title"
            ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/adminSettings/addLanguages')}"
            update="x-title-language-config:multiple-languages-dialog"
            oncomplete="PF('multiple-languages-dialog').show();" />
        </div>
      </h:panelGroup>
    </h:panelGroup>

    <h:panelGroup id="y-axis-title-container" layout="block" styleClass="col-6 p-0">
      <h:panelGroup layout="block" styleClass="field col-12"
        rendered="#{managedBean.statistic.chartType.name() eq 'BAR' or managedBean.statistic.chartType.name() eq 'LINE'}">
        <p:outputLabel
          value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/page/StatisticConfiguration/YAxisTitle')}"
          for="@next" />
        <div class="ui-inputgroup">
          <p:inputText id="y-title" value="#{managedBean.yTitle}" maxlength="200"
            styleClass="w-full" />
          <p:commandButton id="y-title-add-language-button" icon="ti ti-language"
            actionListener="#{managedBean.updateYTitleByLocale()}" process="y-title"
            ariaLabel="#{ivy.cms.co('/ch.ivy.addon.portalkit.ui.jsf/adminSettings/addLanguages')}"
            update="y-title-language-config:multiple-languages-dialog"
            oncomplete="PF('multiple-languages-dialog').show();" />
        </div>
      </h:panelGroup>
    </h:panelGroup>
  </h:panelGroup>

</ui:composition>
