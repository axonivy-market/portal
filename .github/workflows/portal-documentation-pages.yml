name: Publish Documentation Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish PUBLIC documentation to GitHub Pages'
        type: boolean
        default: false
      include_dev:
        description: 'Include the latest published Maven SNAPSHOT for the documentation revision'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.16

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test static site assembly
        run: python3 -m unittest discover -s build/portal-pages -v

      - name: Prepare release manifest and optional development documentation
        run: >-
          mvn -U clean generate-resources -f build/portal-pages/pom.xml
          -DincludeDev=${{ inputs.include_dev }}

      - name: Download and extract legacy release documentation ZIPs
        shell: bash
        run: |
          SITE=target/portal-pages/portal
          ARCHIVES=target/portal-pages/archives
          mkdir -p "$ARCHIVES"
          jq -r 'to_entries[] | [.key, .value] | @tsv' "$SITE/versions.json" |
            while IFS=$'\t' read -r VERSION ARTIFACT; do
              ARCHIVE="$ARCHIVES/portal-guide-$ARTIFACT.zip"
              curl --fail --location --retry 3 \
                "https://maven.axonivy.com/com/axonivy/portal/portal-guide/$ARTIFACT/portal-guide-$ARTIFACT.zip" \
                --output "$ARCHIVE"
              python3 -m zipfile -e "$ARCHIVE" "$SITE/release/$VERSION"
            done

      - name: Prepare static selectors and navigation
        run: python3 build/portal-pages/build_site.py

      - name: Upload complete site for preview or deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/portal-pages/portal
          retention-days: 1

  deploy:
    if: ${{ inputs.publish && github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: portal-documentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy complete static site
        id: deployment
        uses: actions/deploy-pages@v4
