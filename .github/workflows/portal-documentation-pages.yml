name: Deploy Portal Documentation and Schemas to GitHub Pages
run-name: >-
  ${{ !(inputs.publish && github.ref == 'refs/heads/master') && 'Preview Portal Pages'
      || (inputs.expected_release_version != '' && format('Publish Portal {0} to Pages', inputs.expected_release_version))
      || (inputs.refresh_dev && 'Refresh dev documentation on Pages')
      || 'Publish Portal documentation to Pages' }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish PUBLIC documentation and schemas to GitHub Pages'
        type: boolean
        default: false
      include_dev:
        description: 'Include the latest published Maven SNAPSHOT for the documentation revision'
        type: boolean
        default: true
      refresh_dev:
        description: 'Refresh dev documentation without changing live release versions'
        type: boolean
        default: false
      expected_release_version:
        description: 'Release pin to verify (set by Jenkins; leave blank for previews)'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.publish && github.ref == 'refs/heads/master') && 'portal-documentation-pages' || github.run_id }}
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.10.1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test static site assembly
        run: python3 -m unittest discover -s build/portal-pages -v

      - name: Assemble release and optional development documentation
        env:
          RELEASE_VERSION: ${{ inputs.expected_release_version }}
          INCLUDE_DEV: ${{ inputs.refresh_dev || inputs.include_dev }}
          REFRESH_DEV: ${{ inputs.refresh_dev }}
        run: |
          mvn_args=(-B -ntp -f build/portal-pages/pom.xml)
          release_args=()
          release_line=''
          if [[ -n "$RELEASE_VERSION" ]]; then
            release_line=$(cut -d. -f1,2 <<< "$RELEASE_VERSION")
            mvn "${mvn_args[@]}" resources:copy-resources@write-release-manifest
            if ! jq -e --arg line "$release_line" --arg version "$RELEASE_VERSION" \
              '.[$line] == $version' target/portal-pages/portal/versions.json; then
              echo '::error::The requested release is not pinned. Merge the Pages pin PR and dispatch a new run.'
              exit 1
            fi
          fi

          if [[ -n "$release_line" || "$REFRESH_DEV" == true ]]; then
            # Pins merged for other releases may still be waiting for their Portal deployment.
            live_versions=$(curl -fsS --retry 3 --max-time 30 \
              "https://axonivy-market.github.io/portal/versions.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
            for major in 10 12 14; do
              line="$major.0"
              version=$(jq -er --arg line "$line" '.[$line]' <<< "$live_versions")
              if [[ ! "$version" =~ ^${major}\.0\.[0-9]+(\.[0-9]+)?$ ]]; then
                echo "::error::Unexpected live documentation version for $line: $version"
                exit 1
              fi
              if [[ "$line" != "$release_line" ]]; then
                release_args+=("-Dportal$major.version=$version")
              elif [[ $(printf '%s\n' "$version" "$RELEASE_VERSION" | sort -V | tail -n 1) != "$RELEASE_VERSION" ]]; then
                echo "::error::The requested release $RELEASE_VERSION is older than the live version $version."
                exit 1
              fi
            done
          fi

          mvn "${mvn_args[@]}" -U clean generate-resources "-DincludeDev=$INCLUDE_DEV" "${release_args[@]}"

      - name: Unpack legacy LTS10 documentation
        run: bash build/portal-pages/download-lts10-documentation.sh

      - name: Prepare static selectors and navigation
        run: python3 build/portal-pages/build_site.py

      - name: Download published schemas and add them to the complete site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build/schema/download_schema_packages.py

      - name: Upload complete site for preview or deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/portal-pages/portal
          retention-days: 1

      - name: Summarize the documentation in the Pages artifact
        continue-on-error: true
        run: |
          site=target/portal-pages/portal
          {
            echo '### Documentation included in the Pages artifact'
            echo
            jq -r 'to_entries | sort_by(.key | split(".") | map(tonumber))[] | "- \(.key): `\(.value)`"' "$site/versions.json"
            if [[ -d "$site/snapshot/dev" ]]; then
              revision=$(mvn -B -ntp -N -q -f build/portal-pages/pom.xml help:evaluate -Dexpression=revision -DforceStdout -Dstyle.color=never)
              printf -- '- Dev SNAPSHOT revision: `%s`\n' "$revision"
            else
              echo '- Dev documentation: not included'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: ${{ inputs.publish && github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy complete static site
        id: deployment
        uses: actions/deploy-pages@v4
