name: Deploy Portal Documentation and Schemas to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish PUBLIC documentation and schemas to GitHub Pages'
        type: boolean
        default: false
      include_dev:
        description: 'Include the latest published Maven SNAPSHOT for the documentation revision'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.10.1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test static site assembly
        run: python3 -m unittest discover -s build/portal-pages -v

      - name: Assemble release and optional development documentation
        run: >-
          mvn -U clean generate-resources -f build/portal-pages/pom.xml
          -DincludeDev=${{ inputs.include_dev }}

      - name: Unpack legacy LTS10 documentation
        run: bash build/portal-pages/download-lts10-documentation.sh

      - name: Prepare static selectors and navigation
        run: python3 build/portal-pages/build_site.py

      - name: Download published schemas and add them to the complete site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build/schema/download_schema_packages.py

      - name: Upload complete site for preview or deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/portal-pages/portal
          retention-days: 1

  deploy:
    if: ${{ inputs.publish && github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: portal-documentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy complete static site
        id: deployment
        uses: actions/deploy-pages@v4
