name: Deploy Portal Documentation and Schemas to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish PUBLIC documentation and schemas to GitHub Pages'
        type: boolean
        default: false
      include_dev:
        description: 'Include the latest published Maven SNAPSHOT for the documentation revision'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.10.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test static site assembly
        run: python3 -m unittest discover -s build/portal-pages -v

      - name: Prepare release manifest and optional development documentation
        run: >-
          mvn -U clean generate-resources -f build/portal-pages/pom.xml
          -DincludeDev=${{ inputs.include_dev }}

      - name: Download and extract legacy release documentation ZIPs
        run: ./build/portal-pages/download-legacy-documentation.sh

      - name: Prepare static selectors and navigation
        run: python3 build/portal-pages/build_site.py

      - name: Generate schemas
        run: >-
          mvn -B -ntp -f AxonIvyPortal/portal/pom.xml
          -Pjson.schema process-classes

      - name: Copy generated schemas into the complete site
        run: |
          SCHEMA_DIR="AxonIvyPortal/portal/target/schemas"
          test -n "$(find "$SCHEMA_DIR" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          for VERSION_DIR in "$SCHEMA_DIR"/*/; do
            for SCHEMA in portal-dashboard-schema.json portal-statistic-schema.json portal-dashboard-template-schema.json; do
              test -s "$VERSION_DIR$SCHEMA"
              python3 -m json.tool "$VERSION_DIR$SCHEMA" > /dev/null
            done
          done
          mkdir -p target/portal-pages/portal/schemas
          cp -R "$SCHEMA_DIR"/. target/portal-pages/portal/schemas/

      - name: Upload complete site for preview or deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/portal-pages/portal
          retention-days: 1

  deploy:
    if: ${{ inputs.publish && github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: portal-documentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy complete static site
        id: deployment
        uses: actions/deploy-pages@v4