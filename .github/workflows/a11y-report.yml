# Temporary branch-only harness. Restore the original A11y workflow before merge.
name: Portal Pages prototype validation
run-name: Portal Pages prototype validation - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the PUBLIC prototype (experiment branch only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Validate and assemble Portal Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test static site assembly
        run: python3 -B -m unittest discover -s build/portal-pages -v

      - name: Assemble all configured releases
        run: python3 -B build/portal-pages/build_site.py

      - name: Upload complete site for preview or deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/portal-pages/portal
          retention-days: 1

  deploy:
    name: Publish public Portal Pages prototype
    if: ${{ inputs.publish && github.ref == 'refs/heads/build/MARP-4849-experiment-portal-github-pages' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: portal-documentation-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy complete static site
        id: deployment
        uses: actions/deploy-pages@v4
