# Temporary branch-only harness. Restore the original A11y workflow before merge.
name: Portal Pages prototype validation
run-name: Portal Pages prototype validation - ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and assemble Portal Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test static site assembly
        run: python3 -B -m unittest discover -s build/portal-pages -v

      - name: Assemble all configured releases
        run: python3 -B build/portal-pages/build_site.py

      - name: Upload complete site for preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/portal-pages/portal
