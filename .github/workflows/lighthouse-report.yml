name: Daily Build Report Experiment
run-name: Daily Build Report Experiment

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install XML parser
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet
      - name: Report failed builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/daily-build-report.sh
