name: Daily Build Report Experiment
run-name: Daily Build Report Experiment

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Report failed builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/daily-build-report.py
